services:

  postgres:
    image: postgres:17-bookworm
    container_name: document-search-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    command:
      - -path
      - /migrations
      - -database
      - "${DSN}"
      - up
  
  importer:
    build: .
    container_name: document-search-importer
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    command: ["python", "scripts/import_data.py"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: document-search-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - ./esdata:/usr/share/elasticsearch/data

  app:
    build: .
    container_name: document-search-app
    depends_on:
      importer:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env